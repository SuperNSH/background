[package]
name = "nsh-background"
description = "Periodic and deferred work while the app is backgrounded, within OS limits."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "nsh_background"
path = "src/lib.rs"

[dependencies]
nsh-core = "0.5.0"
thiserror = "2"
# `rt`: LocalBackend's timers are spawned tasks, aborted when the backend drops.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util"] }
